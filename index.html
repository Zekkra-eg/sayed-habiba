
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .continue-btn {
      position: fixed;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      background: transparent;
      border: 1px solid #435830;
      color: #435830;
      padding: 14px 45px;
      font-size: 16px;
      letter-spacing: 2px;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease;
    }

    .continue-btn.show {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>

<body>

  <video id="introVideo" autoplay muted playsinline preload="auto">
    <source src="Intros.mp4" type="video/mp4">
  </video>

  <button id="continueBtn" class="continue-btn">
    Continue
  </button>

  <script>
    const video = document.getElementById("introVideo");
    const continueBtn = document.getElementById("continueBtn");

    // Show Continue only after the video ends
    video.addEventListener("ended", () => {
      continueBtn.classList.add("show");
    });

    // Redirect to Zekra website
    continueBtn.addEventListener("click", () => {
      window.location.href = "https://zekra.link/sayed-habiba";
    });
  </script>

</body>
</html>
