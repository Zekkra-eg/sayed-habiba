
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayed - Habiba</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .continue-btn {
      position: fixed;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      background: transparent;
      border: 1px solid #435830;
      color: #435830;
      padding: 14px 45px;
      font-size: 16px;
      letter-spacing: 2px;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease;
    }

    .continue-btn.show {
      opacity: 1;
      visibility: visible;
    }

    .continue-btn:disabled {
      cursor: wait;
    }
  </style>
</head>

<body>

  <!-- Intro Video -->
  <video id="introVideo" autoplay muted playsinline preload="auto">
    <source src="Intros.mp4" type="video/mp4">
  </video>

  <!-- Background Music -->
  <audio id="bgMusic" preload="auto">
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <!-- Continue Button -->
  <button id="continueBtn" class="continue-btn">
    Continue
  </button>

  <script>
    const video = document.getElementById("introVideo");
    const music = document.getElementById("bgMusic");
    const continueBtn = document.getElementById("continueBtn");

    // Show Continue only after the video ends
    video.addEventListener("ended", () => {
      continueBtn.classList.add("show");
    });

    // Open a new tab and redirect after 1 second
    continueBtn.addEventListener("click", () => {

      // Prevent multiple clicks
      continueBtn.disabled = true;

      // Start background music
      music.volume = 0.7;
      music.play().catch(error => {
        console.log("Music playback failed:", error);
      });

      // Open new tab immediately
      const newTab = window.open("about:blank", "_blank");

      if (newTab) {

        // Redirect after 1 second
        setTimeout(() => {
          newTab.location.href = "https://zekra.link/sayed-habiba";
        }, 1000);

      } else {
        continueBtn.disabled = false;
        alert("Please allow pop-ups to open the invitation.");
      }

    });

  </script>

</body>
</html>
